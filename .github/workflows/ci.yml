name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_PATH: ./data/ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm db:migrate:runtime
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sora-blog:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Migrate and smoke-test container
        shell: bash
        run: |
          set -euo pipefail
          volume="sora-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container="sora-ci-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$container" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume"
          docker run --rm \
            -v "$volume:/app/data" \
            sora-blog:ci node scripts/migrate.mjs
          docker run -d --name "$container" \
            -p 127.0.0.1:3100:3000 \
            -v "$volume:/app/data" \
            sora-blog:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3100/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container"
          exit 1
