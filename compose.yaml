# Sora 博客 — Docker Compose 部署配置
#
# 用法：
#   1. 复制 .env.example 为 .env，并填写 APP_URL、AUTH_SECRET、
#      VISITOR_HASH_SECRET、SETUP_TOKEN、TRUSTED_ORIGINS（必填项缺失时本文件会直接报错）
#   2. 启动应用：docker compose up -d
#
# 说明：
#   - 数据库迁移在容器启动时自动执行，无需手动运行迁移命令
#   - 完整备份与恢复请在网页端 /admin/data 完成
#   - 镜像：默认拉取 ghcr.io/lateautumn2/sora（latest 或 SORA_VERSION 指定版本）；
#     本地构建：docker build -t sora-blog:local .，再设置 SORA_IMAGE=sora-blog:local 后启动

name: sora-blog

services:
  app:
    image: ${SORA_IMAGE:-ghcr.io/lateautumn2/sora:${SORA_VERSION:-latest}}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      APP_URL: ${APP_URL:?请在 .env 中设置 APP_URL}
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      VISITOR_HASH_SECRET: ${VISITOR_HASH_SECRET:?请在 .env 中设置 VISITOR_HASH_SECRET}
      SETUP_TOKEN: ${SETUP_TOKEN:?请在 .env 中设置 SETUP_TOKEN}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:?请在 .env 中设置 TRUSTED_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_PATH: /app/data/blog.db
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
