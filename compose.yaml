# Sora 博客 — Docker Compose 部署配置
#
# 全部配置直接写在本文件中，不依赖 .env，部署只需：
#   docker compose up -d
#
# 说明：
#   - 首次启动自动建表并应用数据库迁移，无需手动执行迁移命令
#   - AUTH_SECRET / VISITOR_HASH_SECRET 首次启动自动生成并持久化到 data/secrets/
#   - 站点地址与可信来源在后台 /admin/settings 修改，保存后立即生效，无需重启
#   - 完整备份与恢复请在网页端 /admin/data 完成

name: sora-blog

services:
  app:
    image: ghcr.io/lateautumn2/sora:latest
    restart: unless-stopped
    init: true
    environment:
      DATABASE_PATH: /app/data/blog.db
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
